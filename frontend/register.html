<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daftar akun baru - Kuis Petualangan Ceria">
  <meta name="theme-color" content="#FFD93D">
  <title>Daftar Akun Baru | Kuis Petualangan Ceria</title>

  <!-- Ikon tab browser (emoji burung hantu) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%A6%89%3C/text%3E%3C/svg%3E">

  <!-- Font Poppins (untuk tampilan rapi & mudah dibaca) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- File styling utama -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- =====================================================
       LAPISAN HIASAN: emoji melayang di latar belakang
       (diisi otomatis oleh script.js)
  ====================================================== -->
  <div class="decor-layer" id="decorLayer" aria-hidden="true"></div>

  <!-- =========================================================
       LAPISAN KONFETI: muncul saat jawaban benar / hasil keluar
  ====================================================== -->
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

  <!-- Notifikasi bila JavaScript tidak aktif -->
  <noscript>
    <div class="noscript-note">⚠️ Halaman ini membutuhkan JavaScript agar pendaftaran dapat berjalan.</div>
  </noscript>

  <!-- =========================================================
       HALAMAN DAFTAR AKUN BARU
  ========================================================== -->
  <section class="page active" id="page-register">
    <div class="login-card">
      <div class="login-avatar">📝</div>
      <h2>Daftar Akun Baru</h2>
      <p class="login-sub">Silakan daftar untuk mengakses fitur guru</p>

      <form id="registerForm" novalidate>
        <!-- Input Username -->
        <div class="field">
          <label for="regUsername">Username</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="regUsername" name="username"
                   placeholder="Masukkan username" autocomplete="username">
          </div>
        </div>

        <!-- Input Nama Lengkap -->
        <div class="field">
          <label for="regFullName">Nama Lengkap</label>
          <div class="input-wrap">
            <span class="input-icon">📛</span>
            <input type="text" id="regFullName" name="fullName"
                   placeholder="Masukkan nama lengkap" autocomplete="name">
          </div>
        </div>

        <!-- Input Email -->
        <div class="field">
          <label for="regEmail">Email</label>
          <div class="input-wrap">
            <span class="input-icon">📧</span>
            <input type="email" id="regEmail" name="email"
                   placeholder="Masukkan email" autocomplete="email">
          </div>
        </div>

        <!-- Input Password -->
        <div class="field">
          <label for="regPassword">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="regPassword" name="password"
                   placeholder="Masukkan password" autocomplete="new-password">
            <button type="button" class="toggle-pass" id="toggleRegPass"
                    aria-label="Tampilkan password">👁️</button>
          </div>
        </div>

        <!-- Input Konfirmasi Password -->
        <div class="field">
          <label for="regConfirmPassword">Konfirmasi Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔁</span>
            <input type="password" id="regConfirmPassword" name="confirmPassword"
                   placeholder="Masukkan ulang password" autocomplete="new-password">
          </div>
        </div>

        <!-- Pesan error validasi -->
        <p class="form-error" id="registerError" role="alert"></p>

        <button class="btn btn-login" type="submit">Daftar ➜</button>
        <div class="login-options">
          <a href="index.html" class="register-link">Sudah punya akun? Masuk di sini</a>
        </div>
        <p class="demo-hint">Demo: username <b>guru</b> • password <b>guru123</b> • email <b>guru@example.com</b></p>
      </form>
    </div>
  </section>

  <!-- File logika utama -->
  <script src="script.js"></script>
</body>
</html>
