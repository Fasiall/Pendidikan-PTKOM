<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daftar Materi Belajar untuk anak SD - Kuis Petualangan Ceria">
  <meta name="theme-color" content="#FFD93D">
  <title>📚 Materi Belajar | Kuis Petualangan Ceria</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= HEADER HALAMAN MATERI ================= -->
  <header class="materi-top">
    <a class="icon-btn" href="index.html" title="Kembali ke halaman awal">←</a>
    <div class="materi-top-text">
      <span class="pill-badge">📖 Belajar dulu, baru kuis</span>
      <h1 class="materi-title">📚 Materi Belajar</h1>
    </div>
    <span class="materi-count" id="materiCount">…</span>
  </header>

  <!-- ================= KARTU MATERI ================= -->
  <main class="materi-wrap">
    <div class="materi-grid" id="materiGrid"></div>

    <div class="materi-empty hidden" id="materiEmpty">
      <span class="materi-empty-emoji">📭</span>
      <p>Belum ada materi yang dipublikasikan.<br>Minta gurumu menambahkan materi, ya!</p>
      <a class="btn btn-ghost btn-small" href="index.html">🏠 Halaman Awal</a>
    </div>

    <div class="materi-loading" id="materiLoading">
      <span class="materi-loading-emoji">⏳</span>
      <p>Memuat materi...</p>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="materi.js"></script>
</body>
</html>
