<body class="auth-page">

  <!-- Navbar Kapsul (Single Source of Truth) -->
  <header class="home-nav">
    <a href="index.html" class="nav-brand" data-page="page-home" aria-label="Kuis Ceria - ke beranda">

    </nav>
    <a href="index.html" class="nav-cta" title="Kembali ke beranda"><span>Kembali</span></a>
  </header>

  <!-- Container notifikasi melayang (dipakai script.js) -->
  <div class="toast-container" id="toastContainer" role="region" aria-label="Notifikasi" aria-live="polite"></div>
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

  <noscript>
    <div class="noscript-note">⚠️ Halaman ini membutuhkan JavaScript agar login dapat berjalan.</div>
  </noscript>

  <main class="auth-stage">
    <div class="login-card auth-card">
      <div class="login-avatar" aria-hidden="true"></div>

      <!-- Tab Masuk / Daftar akun -->
      <div class="auth-tabs" role="tablist" aria-label="Pilih Masuk atau Daftar">
        <button type="button" class="auth-tab-btn active" id="tabBtnLogin" role="tab" aria-selected="true">Masuk</button>
        <button type="button" class="auth-tab-btn" id="tabBtnRegister" role="tab" aria-selected="false">Daftar akun</button>
      </div>

      <!-- ============ FORM MASUK ============ -->
      <form id="loginForm" novalidate>
        <h2>Masuk Area Guru</h2>
        <p class="login-sub">Kelola materi, soal, dan pantau hasil kuis siswa</p>

        <div class="field">
          <label for="username">Username atau email</label>
          <div class="input-wrap">
            <input type="text" id="username" name="username"
                   placeholder="Masukkan username atau email" autocomplete="username">
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password"
                   placeholder="Masukkan password" autocomplete="current-password">
            <button type="button" class="toggle-pass" id="togglePass" data-label="true"
                    aria-label="Tampilkan password">Lihat</button>
          </div>
        </div>

        <p class="form-error" id="loginError" role="alert"></p>

        <button class="btn btn-login" type="submit">Masuk</button>

        <div class="login-options">
          Belum punya akun?
          <button type="button" class="link-btn" id="linkToRegister">Daftar akun baru gratis</button>
        </div>
      </form>

      <!-- ============ FORM DAFTAR ============ -->
      <form id="registerForm" novalidate style="display: none;">
        <h2>Daftar Akun Baru</h2>
        <p class="login-sub">Buat akun untuk membuat materi & kuis sendiri</p>

        <div class="field">
          <label for="regUsername">Username</label>
          <div class="input-wrap">
            <input type="text" id="regUsername" name="username"
                   placeholder="Pilih username unik" autocomplete="username">
          </div>
        </div>

        <div class="field">
          <label for="regEmail">Email</label>
          <div class="input-wrap">
            <input type="email" id="regEmail" name="email"
                   placeholder="nama@email.com" autocomplete="email">
          </div>
        </div>

        <div class="field">
          <label for="regPassword">Password</label>
          <div class="input-wrap">
            <input type="password" id="regPassword" name="password"
                   placeholder="Minimal 8 karakter, 1 huruf besar, 1 angka, 1 simbol" autocomplete="new-password">
            <button type="button" class="toggle-pass" id="toggleRegPass" data-label="true"
                    aria-label="Tampilkan password">Lihat</button>
          </div>
          <div class="pw-strength" id="pwStrength" aria-live="polite">
            <div class="pw-strength-bar"><span class="pw-strength-fill" id="pwStrengthFill"></span></div>
            <ul class="pw-checklist" id="pwChecklist">
              <li data-rule="length"><i data-lucide="x"></i> Minimal 8 karakter</li>
              <li data-rule="upper"><i data-lucide="x"></i> Huruf besar (A-Z)</li>
              <li data-rule="number"><i data-lucide="x"></i> Angka (0-9)</li>
              <li data-rule="special"><i data-lucide="x"></i> Simbol (!@#$%^&*)</li>
            </ul>
          </div>
        </div>

        <div class="field">
          <label for="regConfirmPassword">Konfirmasi password</label>
          <div class="input-wrap">
            <input type="password" id="regConfirmPassword" name="confirmPassword"
                   placeholder="Ulangi password" autocomplete="new-password">
          </div>
        </div>

        <p class="form-error" id="registerError" role="alert"></p>

        <button class="btn btn-login" type="submit">Daftar & masuk</button>

        <div class="login-options">
          Sudah punya akun?
          <button type="button" class="link-btn" id="linkToLogin">Masuk di sini</button>
        </div>
      </form>
    </div>
